<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-card">
    <h1>Online Quiz</h1>
    <p class="intro">Test your basic web development knowledge.</p>
    <p id="question-number" class="question-number"></p>
    <h2 id="question">Question will appear here</h2>
    <div id="choices" class="choices"></div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <p id="score" class="score"></p>
    <div class="buttons">
      <button id="previous-button" class="secondary-button" type="button">Previous</button>
      <button id="next-button" type="button">Next</button>
    </div>
    <button id="restart-button" class="restart-button" type="button">Restart Quiz</button>
  </main>
</body>
</html>
